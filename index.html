<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Visor Arq 3D</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header class="toolbar">
      <strong class="brand">Visor Arq 3D</strong>
      <label class="btn primary" title="drawio, glb/gltf, obj, fbx, stl, ply, dae, 3mf, svg">
        Abrir archivo
        <input id="file" type="file" hidden />
      </label>
      <select id="page" title="Página / vista" disabled></select>
      <div class="group" id="diagram-controls">
        <label class="ctl" title="Separación vertical entre niveles de anidación">
          Niveles
          <input id="gap" type="range" min="0" max="3" step="0.05" value="0.5" />
        </label>
        <label class="ctl"><input id="labels" type="checkbox" checked /> Etiquetas</label>
      </div>
      <div class="group">
        <button class="btn" id="view-3d">3D</button>
        <button class="btn" id="view-top">Planta</button>
        <button class="btn" id="fit">Encuadrar</button>
      </div>
      <span id="stats" class="stats"></span>
    </header>

    <main id="stage">
      <div id="drop" class="drop">Suelta aquí un archivo .drawio, .glb, .obj, .stl…</div>
      <div id="error" class="error" hidden></div>
    </main>

    <aside id="panel" class="panel" hidden>
      <button class="close" id="panel-close" aria-label="Cerrar">×</button>
      <div id="panel-body"></div>
    </aside>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
